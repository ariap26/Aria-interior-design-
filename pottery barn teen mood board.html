<!DOCTYPE html>
<html>
<head>
    <title>Room Styles - Tutorial</title>
    <style>
        /* Warm Orange & Yellow Theme */
        body {
            background-color: #FFF9E1; /* Soft Creamy Yellow Background */
            color: #E67E22;           /* Deep Orange Text */
            font-family: 'Segoe UI', Tahoma, sans-serif;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Glitter Overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(#FFD97D 1px, transparent 1px);
            background-size: 25px 25px;
            opacity: 0.5;
            z-index: 0;
            pointer-events: none;
        }

        /* Large Background Star Shapes */
        .star-shape {
            position: fixed;
            background-color: #FFECB3;
            width: 300px;
            height: 300px;
            /* Creates a 5-point star shape */
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            z-index: -1;
            opacity: 0.6;
        }

        .star1 { top: -50px; left: -50px; transform: rotate(-15deg); }
        .star2 { bottom: -50px; right: -50px; transform: rotate(20deg); width: 400px; height: 400px; }

        .container {
            max-width: 700px;
            background: rgba(255, 255, 255, 0.95); /* Slight transparency to see stars */
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(230, 126, 34, 0.1);
            border: 2px solid #FFD97D; /* Golden Yellow Border */
            position: relative;
            z-index: 10;
        }

        a {
            color: #D35400; /* Darker Orange for links */
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 60px;
            border: 2px solid #FFCC80; /* Light Orange Border */
            border-radius: 10px;
            padding: 10px;
            font-family: inherit;
            color: #D35400;
            margin-top: 20px;
            resize: none;
            background-color: #FFFDF5;
            box-sizing: border-box;
        }

        img {
            width: 100%;
            border-radius: 12px;
            margin-top: 15px;
            border: 1px solid #FFCC80;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            color: #E67E22;
        }
    </style>
</head>
<body>

    <div class="star-shape star1"></div>
    <div class="star-shape star2"></div>

    <div class="container">
        <a href="index.html">← Back to Home Page</a>

        <h1>How I Made My Mood Board</h1>

        <textarea>This is how I made my mood board for my room. First it showed me example images of rooms. Then I had to pick some:</textarea>
        <img src="pbt.png" alt="Example rooms">

        <textarea>Then it gave me the option to view and purchase all of the furniture in those rooms.</textarea>
        <img src="furniture.png" alt="Furniture options">

        <textarea>I love how they also have room inspo from different brands, influencers, and famous people.</textarea>
    </div>

</body>
</html>
