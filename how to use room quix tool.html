<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Room Quiz - Waves</title>
    <style>
        /* Basic Setup */
        body {
            background-color: #E0F2F1;
            color: #004D40;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* The Wave (Simple and Reliable) */
        .wave {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background-color: #80CBC4;
            /* Creates a simple curve at the top */
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            z-index: -1;
        }

        /* The Box */
        .container {
            max-width: 600px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #80CBC4;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 100px;
        }

        textarea {
            width: 100%;
            height: 60px;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid #B2DFDB;
            padding: 10px;
            box-sizing: border-box;
        }

        img {
            width: 100%;
            border-radius: 10px;
            margin-top: 10px;
        }

        h1 { color: #00695C; text-align: center; }
        a { color: #00796B; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <a href="coastal.html">← Back to Home Page</a>

        <h1>How to Use the Roometry Quiz</h1>

        <textarea>How to use the roometry room style quiz tool</textarea>
        <img src="s.png" alt="Room quiz"/>

        <textarea>First they ask what colors you prefer</textarea>
        <img src="color.png" alt="Color scheme"/>

        <textarea>Next they ask what collage prints you prefer</textarea>
        <img src="print.png" alt="print"/>

        <textarea>Then they ask what bedding you prefer</textarea>
        <img src="bed.png" alt="bedding"/>

        <textarea>Then they ask what mirror you prefer</textarea>
        <img src="mirror.png" alt="mirror"/>

        <textarea>Then they ask what rug you prefer</textarea>
        <img src="rug.png" alt="rug"/>

        <textarea>Then they continue to ask about your hobbies... Then I got my results! I got Danish pastel.</textarea>
    </div>

    <div class="wave"></div>

</body>
</html>
